[package]
name = "signet-crypto-wasm"
description = "The human surface's ML-KEM-1024 module — the same RustCrypto `ml-kem` the CLI validates against, compiled to wasm32 (PQR item 4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# cdylib = the wasm artifact; rlib keeps the crate testable natively (the
# §11.3 cross-target byte-equality KATs run on BOTH compile targets).
crate-type = ["cdylib", "rlib"]

# The committed pkg must byte-reproduce on EVERY build host (the ci.yml
# wasm-pkg-repro gate). wasm-opt is binaryen's per-platform binary and its
# output diverged macOS↔Linux even at the same wasm-pack version (measured on
# PR #253: three distinct hashes across two platforms), so it is removed from
# the pipeline: the artifact is rustc (rust-toolchain.toml-pinned, path-
# remapped) + wasm-bindgen (Cargo.lock-pinned) output only. Size cost is a few
# KB gz on one lazily-loaded asset — determinism wins.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
wasm-bindgen = "0.2"
# The SAME ml-kem crate as the CLI's differential tests — one implementation,
# two compile targets (PQR Spec §7), so cross-surface goldens come free.
# `deterministic` enables seed-keygen (the PRF-blob v2 stores the 64-byte
# (d,z) seed, spec §7) and the KAT-able deterministic encapsulation.
ml-kem = { version = "0.2", features = ["deterministic"] }
# The `Encapsulate` trait ml-kem's keys implement (the same pre-release pin
# ml-kem 0.2.3 itself carries) + the RNG plumbing.
kem = "=0.3.0-pre.0"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# In the browser, rand_core's OsRng routes to crypto.getRandomValues via
# getrandom's js backend (spec §7: "seed from CSPRNG, getrandom wasm_js").
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
sha2 = "0.10"
# The §11.1 ACVP harness parses the vendored NIST vector JSON
# (docs/design/test-vectors/acvp/) on both compile targets.
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
